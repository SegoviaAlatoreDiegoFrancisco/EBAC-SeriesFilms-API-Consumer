<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
 
    <script defer src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="js/scripts.js"></script>
    <title>Series y Películas</title>
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Navegación principal">
            <a href="index.html" class="site-nav__logo" aria-label="Inicio">
                <img src="img/clapperboard-29986_960_720.png" alt="">
            </a>
            <ul class="site-nav__links">
                <li><a href="#series">Series</a></li>
                <li><a href="#movies">Películas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="intro" aria-labelledby="page-title">
            <h1 id="page-title">Series y Películas</h1>
            <p>Explora títulos destacados</p>
        </section>

        <section class="crousel-section" id="series" aria-labelledby="series-title">
            <header class="carousel-section__header">
                <div>
                    <h2 id="series-title">Series</h2>
                    <p>Series destacadas</p>
                </div>
                <div class="carousel__controls" aria-labelledby="Controles de series">
                    <button class="carousel__button" type="button" 
                        data-direction="-1" aria-label="Ver series anteriores">&#8592</button>
                    <button class="carousel__button" type="button"
                        data-direction="1" aria-label="Ver más series">&#8594</button>
                </div>
            </header>

            <ul class="carousel__list" aria-label="Series destacadas"></ul>
            <p class="carousel__status" role="status" aria-live="polite">Cargando series...</p>
        </section>

        <section class="carousel-section" id="movies" aria-labelledby="movies-title">
            <header class="carousel-section__header">
                <div>
                    <h2 id="movies-title">Películas</h2>
                    <p>Películas populares</p>
                </div>

                <div class="carousel__controls" aria-label="Controles de películas">
                    <button class="carousel__button" type="button" 
                        data-direction="-1" aria-label ="Ver películas anteriores">&#8592</button>
                    <button class="carousel__button" type="button" 
                        data-direction="1" aria-label ="Ver películas siguientes">&#8594</button>
                </div>
            </header>
            <ul class="carousel__list" aria-label="Películas de nuestra lista"></ul>
            <p class="carousel__status"role="status" aria-live="polite">Cargando Películas...</p>
        </section>
    </main>
    <footer class="side-footer">
        <p>&copy 2026 Series y Películas</p>
    </footer>
</body>
</html>
